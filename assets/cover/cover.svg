<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Comic Sans MS','Chalkboard SE',Impact,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa9e0"/>
      <stop offset="1" stop-color="#bdeeff"/>
    </linearGradient>
    <radialGradient id="rays" cx="0.85" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <g id="dibbler">
      <ellipse cx="0" cy="72" rx="26" ry="6" fill="#000" opacity="0.2"/>
      <rect x="-16" y="30" width="32" height="40" rx="5" fill="#7a4bd1" stroke="#222" stroke-width="4"/>
      <circle cx="0" cy="12" r="18" fill="#e9b98c" stroke="#222" stroke-width="4"/>
      <circle cx="-6" cy="10" r="2.6" fill="#222"/>
      <circle cx="6" cy="10" r="2.6" fill="#222"/>
      <ellipse cx="0" cy="22" rx="6" ry="4.5" fill="#8a2a2a" stroke="#222" stroke-width="2"/>
      <path d="M-20 4 Q0 -22 20 4 Z" fill="#e0453a" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-30" y="34" width="14" height="22" rx="3" fill="#ffd84d" stroke="#222" stroke-width="3" transform="rotate(20 -23 45)"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <rect width="1200" height="675" fill="url(#rays)"/>
  <circle cx="1020" cy="100" r="62" fill="#ffd84d" stroke="#f2b705" stroke-width="6"/>

  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="180" cy="110" rx="80" ry="24"/><ellipse cx="230" cy="92" rx="50" ry="24"/>
    <ellipse cx="640" cy="70" rx="70" ry="20"/><ellipse cx="690" cy="56" rx="40" ry="20"/>
  </g>

  <!-- town skyline -->
  <g stroke="#222" stroke-width="4">
    <rect x="0" y="330" width="150" height="200" fill="#ff9d6b"/>
    <rect x="150" y="380" width="120" height="150" fill="#fff3b0"/>
    <rect x="270" y="310" width="140" height="220" fill="#7fd6c2"/>
    <rect x="800" y="350" width="140" height="180" fill="#ff8fb3"/>
    <rect x="940" y="300" width="140" height="230" fill="#ffd27a"/>
    <rect x="1080" y="360" width="120" height="170" fill="#9fc8ff"/>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="3">
    <rect x="30" y="360" width="30" height="36"/><rect x="90" y="360" width="30" height="36"/>
    <rect x="30" y="430" width="30" height="36"/><rect x="90" y="430" width="30" height="36"/>
    <rect x="300" y="340" width="30" height="36"/><rect x="350" y="340" width="30" height="36"/>
    <rect x="300" y="410" width="30" height="36"/><rect x="350" y="410" width="30" height="36"/>
    <rect x="970" y="330" width="30" height="36"/><rect x="1020" y="330" width="30" height="36"/>
    <rect x="970" y="400" width="30" height="36"/><rect x="1020" y="400" width="30" height="36"/>
  </g>

  <!-- hotel -->
  <g stroke="#222" stroke-width="4">
    <rect x="450" y="250" width="300" height="280" fill="#fff" />
    <rect x="450" y="250" width="300" height="40" fill="#e0453a"/>
    <rect x="565" y="450" width="70" height="80" fill="#4a3a2a"/>
  </g>
  <text x="600" y="280" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff" stroke="#222" stroke-width="1">HOTEL</text>
  <g fill="#bfe9ff" stroke="#222" stroke-width="3">
    <rect x="480" y="310" width="40" height="46"/><rect x="580" y="310" width="40" height="46"/><rect x="680" y="310" width="40" height="46"/>
    <rect x="480" y="385" width="40" height="46"/><rect x="680" y="385" width="40" height="46"/>
  </g>

  <!-- palms -->
  <g stroke="#222" stroke-width="4" stroke-linejoin="round">
    <path d="M425 530 Q415 430 430 360" fill="none" stroke-width="12"/>
    <path d="M425 530 Q415 430 430 360" fill="none" stroke="#a9743a" stroke-width="6"/>
    <path d="M430 360 Q380 330 340 360 Q390 345 430 372 Q400 310 360 300 Q420 310 436 365 Q450 310 500 300 Q452 330 438 372 Q480 340 530 360 Q480 340 430 360Z" fill="#35b35a"/>
  </g>

  <!-- street -->
  <rect x="0" y="530" width="1200" height="145" fill="#8a8f99" stroke="#222" stroke-width="4"/>
  <g fill="#f4dfa6" opacity="0.9">
    <rect x="40" y="600" width="90" height="10"/><rect x="260" y="600" width="90" height="10"/>
    <rect x="480" y="600" width="90" height="10"/><rect x="700" y="600" width="90" height="10"/>
    <rect x="920" y="600" width="90" height="10"/>
  </g>

  <!-- chasing dibblers -->
  <use href="#dibbler" transform="translate(200 520) scale(1.1)"/>
  <use href="#dibbler" transform="translate(290 560) scale(0.95)"/>
  <use href="#dibbler" transform="translate(120 565) scale(0.9)"/>
  <use href="#dibbler" transform="translate(900 530) scale(1)"/>

  <!-- tourist -->
  <g transform="translate(600 520) scale(1.7)">
    <ellipse cx="0" cy="62" rx="30" ry="7" fill="#000" opacity="0.25"/>
    <rect x="-12" y="40" width="9" height="22" rx="3" fill="#f2d2b3" stroke="#222" stroke-width="3"/>
    <rect x="3" y="40" width="9" height="22" rx="3" fill="#f2d2b3" stroke="#222" stroke-width="3"/>
    <rect x="-22" y="6" width="44" height="38" rx="6" fill="#ff6b9a" stroke="#222" stroke-width="3.5"/>
    <circle cx="-9" cy="18" r="3.4" fill="#ffe14d"/><circle cx="8" cy="30" r="3.4" fill="#ffe14d"/><circle cx="10" cy="14" r="3.4" fill="#ffe14d"/><circle cx="-6" cy="34" r="3.4" fill="#ffe14d"/>
    <circle cx="0" cy="-8" r="17" fill="#f2d2b3" stroke="#222" stroke-width="3.5"/>
    <circle cx="-6" cy="-9" r="2.5" fill="#222"/><circle cx="6" cy="-9" r="2.5" fill="#222"/>
    <ellipse cx="0" cy="3" rx="5" ry="6" fill="#8a2a2a" stroke="#222" stroke-width="2"/>
    <ellipse cx="0" cy="-20" rx="30" ry="7" fill="#e8c35a" stroke="#222" stroke-width="3.5"/>
    <path d="M-17 -20 Q-16 -40 0 -40 Q16 -40 17 -20 Z" fill="#e8c35a" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-16" y="-27" width="32" height="5" fill="#e0453a"/>
    <path d="M-22 12 L-38 -6" stroke="#222" stroke-width="9" stroke-linecap="round"/>
    <path d="M-22 12 L-38 -6" stroke="#f2d2b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 12 L38 -6" stroke="#222" stroke-width="9" stroke-linecap="round"/>
    <path d="M22 12 L38 -6" stroke="#f2d2b3" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- flying cash -->
  <g fill="#6bd36b" stroke="#222" stroke-width="3">
    <rect x="470" y="470" width="44" height="22" rx="3" transform="rotate(-20 492 481)"/>
    <rect x="700" y="450" width="44" height="22" rx="3" transform="rotate(15 722 461)"/>
    <rect x="385" y="520" width="44" height="22" rx="3" transform="rotate(25 407 531)"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-weight="900" stroke-linejoin="round">
    <text x="600" y="150" font-size="112" fill="#222" stroke="#222" stroke-width="22" transform="rotate(-3 600 150)">DIBBLER</text>
    <text x="600" y="150" font-size="112" fill="#ffd84d" stroke="#e0453a" stroke-width="4" transform="rotate(-3 600 150)">DIBBLER</text>
    <text x="600" y="235" font-size="84" fill="#222" stroke="#222" stroke-width="20" transform="rotate(-3 600 235)">ESCAPE</text>
    <text x="600" y="235" font-size="84" fill="#ff6b9a" stroke="#fff" stroke-width="3" transform="rotate(-3 600 235)">ESCAPE</text>
  </g>
</svg>
